make_dataset:
  test_size: 0.1
  random_state: 30

data_preprocessing:
  percentiles:
    - 0.002
    - 0.998

stacking:
  random_state: 42
  target_transform: log
  cv_folds: 5
  n_jobs: 1

  xgboost:
    n_trials: 20
    cv_folds: 5
    tree_method: hist
    device: cuda

  lightgbm:
    n_trials: 20
    cv_folds: 5
    device_type: cpu
    n_jobs: -1

  ridge:
    n_trials: 20
    cv_folds: 3

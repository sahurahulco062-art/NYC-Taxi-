[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nyc_taxi"
version = "0.0.1"
description = "Machine Learing project to predict trip duration for taxis in NYC"
authors = [
  { name = "NIGGERSAURUS" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["nyc_taxi"]
include = ["pyproject.toml", "nyc_taxi/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["nyc_taxi"]
force-sort-within-sections = true

